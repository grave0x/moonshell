[package]
name = "moonshell"
version = "0.1.0"
edition = "2024"
description = "Moonshell — open-source, moddable, horde-scale incremental tower defense (P1 core loop)"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "wayland",
    "x11",
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_asset",
    "bevy_image",
    "bevy_color",
    "bevy_camera",
    "bevy_log",
    "bevy_input_focus",
    "bevy_mesh",
    "png",
] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
